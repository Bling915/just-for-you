services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: just_for_you
      MYSQL_USER: just_for_you
      MYSQL_PASSWORD: local-development
      MYSQL_ROOT_PASSWORD: local-root-development
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-development"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["mysql-data:/var/lib/mysql"]
volumes:
  mysql-data:
